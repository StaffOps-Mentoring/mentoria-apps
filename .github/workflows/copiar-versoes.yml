name: copiar-versoes

# Uma vez só (2026-10-28): as imagens passaram a se chamar staffops-<app>. Copia as versões já
# publicadas com o nome antigo para o nome novo, com o mesmo digest (o índice inteiro).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          set -eu
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for app in vitrine api cofre sonda; do
            for v in 0.2.0 0.3.0; do
              docker buildx imagetools create -t "$base/staffops-$app:$v" "$base/$app:$v"
              echo "::notice::$base/staffops-$app:$v"
            done
          done
